# Egress proxy for hermes-agent. Only CONNECT to the hostnames in allowed-domains.txt on
# port 443 is permitted. No TLS interception: Discord's certificates reach the agent
# untouched, so only hostnames are checked, not paths. Everything else is denied and logged.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_hosts dstdomain "/etc/squid/allowed-domains.txt"

http_access deny !SSL_ports
http_access allow CONNECT SSL_ports allowed_hosts
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/null
pid_filename /var/run/squid/squid.pid
