server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Official Hermes Agent image writes plain-text logs under /opt/data/logs (mounted here at
  # /var/log/hermes/logs). Lines are not JSON, so no parsing stage: each line is stored as-is.
  - job_name: hermes-agent
    static_configs:
      - targets: [localhost]
        labels:
          job: hermes-agent
          __path__: /var/log/hermes/logs/*.log

  # One sanitized JSON line per session, written by scripts/session_summary.py. Only the platform is a
  # label; session IDs stay as fields so they don't multiply Loki's stream count.
  - job_name: hermes-sessions
    static_configs:
      - targets: [localhost]
        labels:
          job: hermes-sessions
          __path__: /var/log/hermes/logs/sessions-summary.jsonl
    pipeline_stages:
      - json:
          expressions:
            platform: platform
      - labels:
          platform:
