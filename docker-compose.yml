services:
  # Only route out of agent-net: the agent's HTTPS_PROXY/DISCORD_PROXY point here, and
  # firewalld (scripts/01_apply_hermes_egress_policy.sh) rejects any other outbound
  # traffic from agent-net. allowed-domains.txt is the complete list of hostnames it will
  # tunnel to; everything else is denied and logged. No TLS interception.
  egress-proxy:
    image: ${EGRESS_PROXY_IMAGE:?set EGRESS_PROXY_IMAGE in .env (see docs/INSTALL.md)}
    container_name: hermes-egress-proxy
    restart: unless-stopped
    # The image's entrypoint runs `squid "$@"`. Without these flags Squid forks to the background,
    # the container's main process exits, and Docker restarts it in a loop. -N keeps Squid in the
    # foreground, -Y and -C match the image's default, and -d 1 sets log verbosity.
    command: ["-NYCd", "1"]
    read_only: true
    # Squid runs as the "proxy" user after startup, so its runtime directories must be writable by it.
    tmpfs:
      - /var/run/squid:mode=1777
      - /var/spool/squid:mode=1777
      - /var/log/squid:mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/egress-proxy/squid.conf:/etc/squid/squid.conf:ro,Z
      - ./config/egress-proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro,Z
    networks:
      agent-net:
        ipv4_address: ${EGRESS_PROXY_IP:?set EGRESS_PROXY_IP in .env}
      egress-net:

  hermes-agent:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-v2026.9.24}
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    security_opt:
      - no-new-privileges:true
    # The agent reads its own secrets from ./hermes-data/.env (the official image's /opt/data/.env),
    # not from this compose .env, so the compose .env's values never enter the container.
    environment:
      HERMES_DASHBOARD: "1"
      HTTP_PROXY: http://${EGRESS_PROXY_IP:?set EGRESS_PROXY_IP in .env}:3128
      HTTPS_PROXY: http://${EGRESS_PROXY_IP:?set EGRESS_PROXY_IP in .env}:3128
      DISCORD_PROXY: http://${EGRESS_PROXY_IP:?set EGRESS_PROXY_IP in .env}:3128
      # LM Studio goes direct, not through the egress proxy. The proxy only tunnels Discord hosts,
      # and firewalld allows agent-net to reach only the proxy and tcp/1234 on the Windows host.
      NO_PROXY: "host.docker.internal,localhost,127.0.0.1,${HOST_LM_STUDIO_IP:?set HOST_LM_STUDIO_IP in .env}"
    volumes:
      # Everything the official image keeps: .env, config.yaml, sessions, memories, skills,
      # logs. Git-ignored (see .gitignore); holds the Discord token and dashboard password.
      - ./hermes-data:/opt/data
    ports:
      # Bound to the VM's host-only address only, never 0.0.0.0. Set HERMES_BIND_IP in .env.
      - "${HERMES_BIND_IP:?set HERMES_BIND_IP in .env}:${HERMES_API_PORT:-8642}:8642"
      - "${HERMES_BIND_IP:?set HERMES_BIND_IP in .env}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    networks:
      - agent-net
    extra_hosts:
      # Windows host's LM Studio, on the VirtualBox host-only adapter.
      - "host.docker.internal:${HOST_LM_STUDIO_IP:?set HOST_LM_STUDIO_IP in .env}"

  loki:
    image: grafana/loki:3.1.1
    container_name: hermes-loki
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro,Z
      - loki-data:/loki:Z
    networks:
      - obs-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hermes-promtail
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro,Z
      - ./hermes-data:/var/log/hermes:ro,Z
      - promtail-positions:/tmp/positions:Z
    networks:
      - obs-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hermes-grafana
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${HERMES_BIND_IP:?set HERMES_BIND_IP in .env}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana:Z
      - ./config/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro,Z
      - ./config/grafana-dashboards-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro,Z
      - ./dashboards:/etc/grafana/provisioning/dashboards/files:ro,Z
    networks:
      - obs-net
    depends_on:
      - loki

networks:
  agent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  egress-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.11.0/24
  obs-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24

volumes:
  loki-data:
  grafana-data:
  promtail-positions:
