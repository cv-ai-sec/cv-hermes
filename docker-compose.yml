services:
  hermes-agent:
    build: ./hermes_agent
    container_name: hermes-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - ./workspace:/workspace:Z
      - ./config:/app/config:ro,Z
      - hermes-logs:/var/log/hermes:Z
      # Output of the summarize/task pipeline: generated notes and the local SQLite
      # task DB. If hermes-agent fails to start with a permission error writing here,
      # the bind-mounted host directory probably isn't owned by UID 10001 (the
      # container's non-root user) — see docs/INSTALL.md's troubleshooting section.
      - ./notes:/app/notes:Z
      - ./data:/app/data:Z
    ports:
      # Local web chat UI (hermes_agent/adapters/web_adapter.py) — bypasses Discord
      # entirely. Same posture as Grafana/task-dashboard: bound to all interfaces at
      # the Docker level, firewalld on the VM restricts actual reachability to
      # LOCAL_SUBNET only. No auth of its own. Set WEB_CHAT_ENABLED=false in .env to
      # disable it (e.g. Discord-only deployments) rather than removing this line.
      - "${WEB_CHAT_PORT:-8503}:${WEB_CHAT_PORT:-8503}"
    networks:
      - agent-net
    extra_hosts:
      # Points host.docker.internal at the Windows host's VirtualBox host-only adapter IP
      # (not Docker's own host-gateway, which would resolve to the VM itself, not the
      # Windows host one level up) — same pattern as ai-cybersecurity-devops-lab, so Hermes
      # can reach LM Studio running on Windows. Irrelevant if you point LLM_API_BASE at a
      # cloud provider instead.
      - "host.docker.internal:${HOST_LM_STUDIO_IP:-192.168.56.1}"
    # Only this container needs outbound internet (Discord gateway + the configured LLM
    # API). loki/promtail/grafana below live on a separate network that firewalld blocks
    # from reaching the internet at all — see scripts/00_setup_rocky9_host.sh and README.md
    # ("Network isolation" section) for why that split exists and what it does/doesn't cover.

  task-dashboard:
    build: ./task_dashboard
    container_name: hermes-task-dashboard
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TASK_DB_PATH: /app/data/tasks.db
    volumes:
      # Same ./data bind mount as hermes-agent — both containers open tasks.db
      # concurrently; see task_dashboard/db.py and hermes_agent/services/task_db.py
      # for the WAL-mode tradeoff that makes that safe.
      - ./data:/app/data:Z
    ports:
      # Same posture as Grafana below: bound to all interfaces at the Docker level,
      # firewalld on the VM restricts actual reachability to LOCAL_SUBNET only. No auth
      # of its own — do not expose this port beyond the local subnet. See docs/INSTALL.md.
      - "${TASK_DASHBOARD_PORT:-8502}:8000"
    networks:
      - obs-net
    # No outbound internet needed — this service only reads/writes the local
    # SQLite file, so it sits on obs-net (firewalld-blocked from the internet)
    # rather than agent-net, same reasoning as Loki/Promtail/Grafana below.

  loki:
    image: grafana/loki:3.1.1
    container_name: hermes-loki
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro,Z
      - loki-data:/loki:Z
    networks:
      - obs-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hermes-promtail
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro,Z
      - hermes-logs:/var/log/hermes:ro,Z
      - promtail-positions:/tmp/positions:Z
    networks:
      - obs-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hermes-grafana
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Bound to all interfaces at the Docker level; firewalld on the VM restricts actual
      # reachability to the local subnet only — see scripts/00_setup_rocky9_host.sh.
      # Override GRAFANA_PORT in .env if 3000 is already taken on this VM — e.g.
      # ai-cybersecurity-devops-lab's open-webui also defaults to host port 3000.
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana:Z
      - ./config/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro,Z
      - ./config/grafana-dashboards-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro,Z
      - ./dashboards:/etc/grafana/provisioning/dashboards/files:ro,Z
    networks:
      - obs-net
    depends_on:
      - loki

networks:
  agent-net:
    driver: bridge
  obs-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24

volumes:
  hermes-logs:
  loki-data:
  grafana-data:
  promtail-positions:
