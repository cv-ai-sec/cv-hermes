services:
  hermes-agent:
    build: ./hermes_agent
    container_name: hermes-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - ./workspace:/workspace:Z
      - ./config:/app/config:ro,Z
      - hermes-logs:/var/log/hermes:Z
    networks:
      - agent-net
    extra_hosts:
      # Points host.docker.internal at the Windows host's VirtualBox host-only adapter IP
      # (not Docker's own host-gateway, which would resolve to the VM itself, not the
      # Windows host one level up) — same pattern as ai-cybersecurity-devops-lab, so Hermes
      # can reach LM Studio running on Windows. Irrelevant if you point LLM_API_BASE at a
      # cloud provider instead.
      - "host.docker.internal:${HOST_LM_STUDIO_IP:-192.168.56.1}"
    # Only this container needs outbound internet (Discord gateway + the configured LLM
    # API). loki/promtail/grafana below live on a separate network that firewalld blocks
    # from reaching the internet at all — see scripts/00_setup_rocky9_host.sh and README.md
    # ("Network isolation" section) for why that split exists and what it does/doesn't cover.

  loki:
    image: grafana/loki:3.1.1
    container_name: hermes-loki
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro,Z
      - loki-data:/loki:Z
    networks:
      - obs-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hermes-promtail
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro,Z
      - hermes-logs:/var/log/hermes:ro,Z
      - promtail-positions:/tmp/positions:Z
    networks:
      - obs-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hermes-grafana
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Bound to all interfaces at the Docker level; firewalld on the VM restricts actual
      # reachability to the local subnet only — see scripts/00_setup_rocky9_host.sh.
      # Override GRAFANA_PORT in .env if 3000 is already taken on this VM — e.g.
      # ai-cybersecurity-devops-lab's open-webui also defaults to host port 3000.
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana:Z
      - ./config/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro,Z
      - ./config/grafana-dashboards-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro,Z
      - ./dashboards:/etc/grafana/provisioning/dashboards/files:ro,Z
    networks:
      - obs-net
    depends_on:
      - loki

networks:
  agent-net:
    driver: bridge
  obs-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24

volumes:
  hermes-logs:
  loki-data:
  grafana-data:
  promtail-positions:
