<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Chat</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #8b919c; --accent: #5b8cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text);
  }
  header { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  header .status { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.hermes { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; }
  form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--border); }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Hermes</h1>
  <div class="status" id="status">connecting…</div>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Message Hermes — try: summarize <youtube-url>, task <title>" autocomplete="off" disabled>
  <button id="send" disabled>Send</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

const proto = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(`${proto}//${location.host}/ws`);

ws.onopen = () => {
  statusEl.textContent = "connected";
  input.disabled = false;
  sendBtn.disabled = false;
  addMessage("Connected to Hermes. No Discord required.", "system");
};

ws.onclose = () => {
  statusEl.textContent = "disconnected — reload to reconnect";
  input.disabled = true;
  sendBtn.disabled = true;
};

ws.onmessage = (event) => addMessage(event.data, "hermes");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "user");
  ws.send(text);
  input.value = "";
});
</script>
</body>
</html>
