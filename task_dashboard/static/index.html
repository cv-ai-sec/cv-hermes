<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Task Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb;
    --muted: #8b919c; --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; }
  form#add-form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, textarea {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 14px;
  }
  input[name=title] { width: 220px; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button:hover { opacity: 0.9; }
  main {
    display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr));
    gap: 14px; padding: 20px; overflow-x: auto;
  }
  .column { background: var(--panel); border-radius: 10px; padding: 10px; min-height: 200px; }
  .column h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 4px 6px 12px;
  }
  .card {
    background: #1f2430; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-bottom: 10px; cursor: default;
  }
  .card .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .card .desc { font-size: 12px; color: var(--muted); margin-bottom: 8px; white-space: pre-wrap; }
  .card .meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .card select { font-size: 12px; padding: 4px 6px; }
  .card button.del { background: transparent; border: 1px solid #5a2a2a; color: #e08080; padding: 4px 8px; font-size: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Hermes Task Dashboard</h1>
  <form id="add-form">
    <input name="title" placeholder="New task title" required>
    <input name="description" placeholder="Description (optional)">
    <button type="submit">Add Task</button>
  </form>
</header>
<main id="board"></main>
<script>
const STATUSES = ["Backlog", "In Progress", "Completed", "Failed"];

async function fetchTasks() {
  const res = await fetch("/api/tasks");
  return res.json();
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}

function renderCard(task) {
  const options = STATUSES.map(s =>
    `<option value="${s}" ${s === task.status ? "selected" : ""}>${s}</option>`
  ).join("");
  return `
    <div class="card" data-id="${task.id}">
      <div class="title">#${task.id} ${escapeHtml(task.title)}</div>
      ${task.description ? `<div class="desc">${escapeHtml(task.description)}</div>` : ""}
      <div class="meta">source: ${escapeHtml(task.source)}${task.note_path ? " · note saved" : ""}</div>
      <div class="actions">
        <select onchange="changeStatus(${task.id}, this.value)">${options}</select>
        <button class="del" onclick="removeTask(${task.id})">Delete</button>
      </div>
    </div>`;
}

async function render() {
  const tasks = await fetchTasks();
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map(status => {
    const items = tasks.filter(t => t.status === status);
    return `
      <div class="column">
        <h2>${status} (${items.length})</h2>
        ${items.map(renderCard).join("")}
      </div>`;
  }).join("");
}

async function changeStatus(id, status) {
  await fetch(`/api/tasks/${id}/status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status })
  });
  render();
}

async function removeTask(id) {
  if (!confirm(`Delete task #${id}?`)) return;
  await fetch(`/api/tasks/${id}`, { method: "DELETE" });
  render();
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const title = form.title.value.trim();
  if (!title) return;
  await fetch("/api/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, description: form.description.value.trim() || null })
  });
  form.reset();
  render();
});

render();
setInterval(render, 10000);
</script>
</body>
</html>
